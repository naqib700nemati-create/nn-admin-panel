<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6b63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مدیریت NN حساب - فقط برای نقیب</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#14282b;--mut:#3f5254;--ac:#0e6b63;--acf:#fff;--bad:#b3411e;--ln:#bccac3}
@media(prefers-color-scheme:dark){:root{--bg:#101a1a;--card:#182524;--ink:#e6efec;--mut:#92a8a5;--ac:#3fb5a8;--acf:#08201d;--bad:#ff8a65;--ln:#2a3b3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 Vazirmatn,"Noto Naskh Arabic",Tahoma,sans-serif;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto;padding-top:calc(14px + env(safe-area-inset-top,0px))}
h1{font-size:19px;margin:4px 0 2px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(20,40,40,.06)}
.m{color:var(--mut);font-size:13.5px}.bad{color:var(--bad)}.ok{color:#19a974}
label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px}
textarea.code{direction:ltr;font-size:12px;word-break:break-all;min-height:90px}
button{background:var(--ac);color:var(--acf);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:700;margin:8px 6px 0 0}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.d{background:var(--bad);color:#fff}
button.sm{padding:6px 10px;font-size:13px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--ln);padding:5px;text-align:right}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;background:var(--card);color:var(--ac);border:2px solid var(--ac);margin:0}
.tabs button.on{background:var(--ac);color:var(--acf)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}
.t{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--ln);white-space:nowrap}
.t.on{background:#19a97422;border-color:#19a974;color:#19a974}
.t.tr{background:#d89a1b22;border-color:#d89a1b;color:#d89a1b}
.t.ex{background:#b3411e22;border-color:#b3411e;color:#b3411e}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center;z-index:9}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<h1>مدیریت NN حساب</h1>
<div class="m">این صفحه فقط برای توست. آدرسش را به کسی نده.</div>

<div class="c" id="kbox"></div>

<div id="mainbox" style="display:none">
<div class="tabs">
<button id="tb-cust" onclick="TAB='cust';render()">مشتریان</button>
<button id="tb-not" onclick="TAB='not';render()">اطلاعیه‌ها</button>
<button id="tb-bk" onclick="TAB='bk';render()">پشتیبان</button>
</div>
<div id="body"></div>
</div>

<div class="ov" id="ov" onclick="if(event.target==this)closeM()"><div class="sh" id="sh"></div></div>

<input type="file" id="kf" accept=".json" style="display:none" onchange="loadKey(this.files[0])">
<input type="file" id="bf" accept=".json" style="display:none" onchange="restoreAll(this.files[0])">

<script>
const $=s=>document.querySelector(s);
const KEY='nn_issuer_key',CK='nn_customers',NK='nn_notices',HK='nn_issued';
let TAB='cust',CF='all',CQ='';
const b64u=a=>btoa(String.fromCharCode.apply(null,Array.from(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDev=d=>String(d||'').replace(/[\s-]+/g,'').toUpperCase().replace(/(.{4})(?=.)/g,'$1-');
const keys=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const id=()=>Date.now()+Math.floor(Math.random()*1000);
const cust=()=>{try{return JSON.parse(localStorage.getItem(CK))||[]}catch(e){return[]}};
const saveCust=a=>localStorage.setItem(CK,JSON.stringify(a));
const notes=()=>{try{return JSON.parse(localStorage.getItem(NK))||[]}catch(e){return[]}};
const saveNotes=a=>localStorage.setItem(NK,JSON.stringify(a));
function cp(sel){const e=$(sel);e.select();try{document.execCommand('copy')}catch(x){}try{navigator.clipboard&&navigator.clipboard.writeText(e.value)}catch(x){}}
function modal(h){$('#sh').innerHTML=h;$('#ov').className='ov on'}
function closeM(){$('#ov').className='ov'}

/* ===== کلید ===== */
async function makeKeys(){
  const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const v={priv:await crypto.subtle.exportKey('jwk',k.privateKey),pub:await crypto.subtle.exportKey('jwk',k.publicKey)};
  localStorage.setItem(KEY,JSON.stringify(v));return v;
}
async function makeCode(dev,name,months){
  const kk=keys();if(!kk)throw new Error('کلید نیست');
  let e='';if(+months){const d=new Date();d.setMonth(d.getMonth()+(+months));e=d.toISOString().slice(0,10)}
  const payload=new TextEncoder().encode(JSON.stringify({d:dev,n:name,e:e,i:today()}));
  const pk=await crypto.subtle.importKey('jwk',kk.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
  const pl=b64u(payload);
  const sig=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},pk,new TextEncoder().encode(pl)));
  return {code:pl+'.'+b64u(sig),exp:e};
}
async function gen(){try{await makeKeys();render()}catch(e){alert('این مرورگر ساختن کلید را پشتیبانی نمی‌کند. صفحه را از Chrome تازه باز کن.')}}
function saveKey(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(keys())],{type:'application/json'}));a.download='nn-license-key-PRIVATE.json';a.click()}
function loadKey(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.priv||!x.pub)throw 0;localStorage.setItem(KEY,JSON.stringify(x));render()}catch(e){alert('فایل کلید درست نیست')}};r.readAsText(f)}

/* ===== یک‌بار: آوردن فهرست قدیمی کدها به دفتر مشتری ===== */
function migrateOld(){if(localStorage.getItem(CK)!=null)return;
  let h=[];try{h=JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){}
  if(!h.length){saveCust([]);return}
  const byDev={};
  h.slice().reverse().forEach(x=>{const d=String(x.d||'').replace(/[\s-]+/g,'').toUpperCase();if(!d)return;
    byDev[d]=byDev[d]||{id:id(),name:x.n,phone:'',biz:'',dev:d,status:'active',note:'',issued:[]};
    byDev[d].name=x.n;byDev[d].issued.push({t:x.t,exp:x.e||''});
  });
  const list=Object.values(byDev).map(c=>{const last=c.issued[c.issued.length-1];c.status=(last.exp&&last.exp<today())?'expired':'active';return c});
  saveCust(list);
}

/* ===== مشتریان ===== */
function custStatusLabel(s){return {trial:'آزمایشی',active:'فعال',expired:'منقضی',none:'بدون کد'}[s]||'—'}
function custStatusClass(s){return s=='active'?'on':s=='trial'?'tr':s=='expired'?'ex':''}
function custForm(cid){const c=cid?cust().find(x=>x.id==cid):{name:'',phone:'',biz:'',dev:'',status:'trial',note:'',issued:[]};
modal('<h3 style="margin:0 0 4px">'+(cid?'ویرایش مشتری':'مشتری تازه')+'</h3>'
+'<label>نام مشتری یا دوکان *<input id="f_n" value="'+esc(c.name)+'"></label>'
+'<label>شماره تماس<input id="f_p" value="'+esc(c.phone)+'" dir="ltr"></label>'
+'<label>نوع کار<select id="f_b"><option value="">—</option>'+['دوکان','سوپرمارکیت','دواخانه','شرکت وارداتی','ساختمانی','ترانسپورت','عمومی','سایر'].map(x=>'<option'+(c.biz==x?' selected':'')+'>'+x+'</option>').join('')+'</select></label>'
+'<label>وضعیت<select id="f_s">'+['trial','active','expired','none'].map(x=>'<option value="'+x+'"'+(c.status==x?' selected':'')+'>'+custStatusLabel(x)+'</option>').join('')+'</select></label>'
+'<label>شناسه دستگاه (اگر مشتری فرستاده)<input id="f_d" value="'+esc(fmtDev(c.dev))+'" dir="ltr" placeholder="XXXX-XXXX-XXXX"></label>'
+'<label>یادداشت<textarea id="f_note">'+esc(c.note)+'</textarea></label>'
+(c.issued&&c.issued.length?'<div class="m" style="margin-top:10px"><b>تاریخچه کدها</b></div>'+c.issued.slice().reverse().map(x=>'<div class="row"><span>'+x.t+'</span><span>'+(x.exp?'تا '+x.exp:'دائمی')+'</span></div>').join(''):'')
+'<div class="bar"><button onclick="custSave('+(cid||0)+',false)">ذخیره</button><button class="g" onclick="custSave('+(cid||0)+',true)">ذخیره و ساختن کد فعال‌سازی</button></div>'
+'<div id="cout"></div>'
+(cid?'<div class="bar"><button class="d" onclick="custDel('+cid+')">حذف مشتری</button></div>':''))}
async function custSave(cid,withCode){const name=$('#f_n').value.trim();if(!name)return alert('نام را بنویس');
const dev=$('#f_d').value.trim().toUpperCase().replace(/[\s-]+/g,'');
if(withCode&&!/^[A-Z0-9]{12}$/.test(dev))return alert('برای ساختن کد، شناسه دستگاه باید ۱۲ حرف/عدد باشد (مثل ABCD-EFGH-JKMN).');
let list=cust(),c=cid?list.find(x=>x.id==cid):null;
if(!c){c={id:id(),issued:[]};list.unshift(c)}
c.name=name;c.phone=$('#f_p').value.trim();c.biz=$('#f_b').value;c.note=$('#f_note').value.trim();c.dev=dev;c.status=$('#f_s').value;
if(withCode){try{const r=await makeCode(dev,name,0);c.issued=c.issued||[];c.issued.push({t:today(),exp:r.exp});c.status='active';saveCust(list);
$('#cout').innerHTML='<label>کد فعال‌سازی (برای مشتری بفرست)<textarea readonly class="code" id="cd">'+r.code+'</textarea></label><button class="g sm" onclick="cp(\'#cd\')">کپی کد</button><div class="m ok">ذخیره شد.</div>';render();return}
catch(e){return alert('کد ساخته نشد: '+e.message)}}
saveCust(list);closeM();render()}
function custDel(cid){if(!confirm('این مشتری از دفتر حذف شود؟ (کدی که قبلاً داده‌ای همچنان کار می‌کند)'))return;saveCust(cust().filter(x=>x.id!=cid));closeM();render()}
function custBody(){const L=cust().filter(c=>(CF=='all'||c.status==CF)&&(c.name+c.phone+c.dev).toLowerCase().includes(CQ.toLowerCase())).sort((a,b)=>b.id-a.id);
const n=(s)=>cust().filter(c=>s=='all'||c.status==s).length;
return '<div class="c"><input placeholder="جستجو: نام، تلفن، شناسه دستگاه..." value="'+esc(CQ)+'" oninput="CQ=this.value;renderBody()">'
+'<div class="bar">'+[['all','همه'],['trial','آزمایشی'],['active','فعال'],['expired','منقضی']].map(x=>'<button class="'+(CF==x[0]?'':'g')+' sm" onclick="CF=\''+x[0]+'\';renderBody()">'+x[1]+' ('+n(x[0])+')</button>').join('')+'</div>'
+'<div class="bar"><button onclick="custForm()">+ مشتری تازه</button></div></div>'
+'<div class="c">'+(L.length?L.map(c=>'<div class="row" onclick="custForm('+c.id+')" style="cursor:pointer"><div><b>'+esc(c.name)+'</b> <span class="t '+custStatusClass(c.status)+'">'+custStatusLabel(c.status)+'</span><br><small class="m">'+esc(c.phone||'')+(c.biz?' · '+esc(c.biz):'')+'</small></div><small class="m" dir="ltr">'+(c.dev?fmtDev(c.dev):'')+'</small></div>').join(''):'<div class="m">کسی در این فهرست نیست.</div>')+'</div>'}

/* ===== اطلاعیه‌ها ===== */
function notAdd(){const t=$('#n_t').value.trim(),b=$('#n_b').value.trim();if(!t||!b)return alert('عنوان و متن را بنویس');
const n=notes();n.unshift({key:'n'+id(),title:t,body:b,important:$('#n_i').checked?1:0,date:today(),sent:false});saveNotes(n);
$('#n_t').value='';$('#n_b').value='';$('#n_i').checked=false;renderBody()}
function notToggle(k){const n=notes();const x=n.find(y=>y.key==k);if(x)x.sent=!x.sent;saveNotes(n);renderBody()}
function notDel(k){if(!confirm('این اطلاعیه از صف حذف شود؟'))return;saveNotes(notes().filter(x=>x.key!=k));renderBody()}
function notCopy(k){const n=notes().find(x=>x.key==k);if(!n)return;
const txt='{id:'+JSON.stringify(n.key)+',title:'+JSON.stringify(n.title)+',body:'+JSON.stringify(n.body)+',important:'+(n.important?1:0)+'}';
const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
try{document.execCommand('copy')}catch(e){}try{navigator.clipboard&&navigator.clipboard.writeText(txt)}catch(e){}document.body.removeChild(ta);
alert('کپی شد. این متن دقیقاً همان شکلی است که باید در فهرست NOTICES برنامه اضافه شود. آن را برای من بفرست.')}
function notBody(){const L=notes();
return '<div class="c"><b>اطلاعیه تازه</b><div class="m">این اطلاعیه در صف ذخیره می‌شود. برای اینکه واقعاً به زنگوله مشتری‌ها برسد، باید نسخه برنامه با همین اطلاعیه در GitHub تازه شود.</div>'
+'<label>عنوان<input id="n_t"></label><label>متن<textarea id="n_b"></textarea></label><label style="display:flex;align-items:center;gap:8px;margin-top:10px"><input type="checkbox" id="n_i" style="width:auto"> نشان «مهم» داشته باشد</label>'
+'<div class="bar"><button onclick="notAdd()">افزودن به صف</button></div></div>'
+'<div class="c"><b>صف اطلاعیه‌ها</b>'+(L.length?L.map(n=>'<div class="row"><div><b>'+esc(n.title)+'</b>'+(n.important?' <span class="t ex">مهم</span>':'')+(n.sent?' <span class="t on">ارسال‌شده</span>':' <span class="t tr">آماده ارسال</span>')+'<br><small class="m">'+n.date+' · '+esc(n.body.slice(0,60))+(n.body.length>60?'…':'')+'</small></div><div class="bar" style="margin:0"><button class="g sm" onclick="notCopy(\''+n.key+'\')">کپی برای برنامه</button><button class="g sm" onclick="notToggle(\''+n.key+'\')">'+(n.sent?'نشان نرفته':'نشان ارسال‌شده')+'</button><button class="d sm" onclick="notDel(\''+n.key+'\')">حذف</button></div></div>').join(''):'<div class="m">صف خالی است.</div>')+'</div>'}

/* ===== پشتیبان ===== */
function backupAll(){const d={customers:cust(),notices:notes(),at:today()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='nn-admin-backup-'+today()+'.json';a.click()}
function restoreAll(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.customers)throw 0;saveCust(x.customers);saveNotes(x.notices||[]);render();alert('برگردانده شد.')}catch(e){alert('فایل درست نیست.')}};r.readAsText(f)}
function bkBody(){return '<div class="c"><b>کاپی اطلاعات این ابزار (مشتریان و اطلاعیه‌ها)</b><div class="m">کلید خصوصی جدا است؛ از همان دکمه بالای صفحه کاپی بگیر. این دکمه فقط دفتر مشتری و صف اطلاعیه را کاپی می‌گیرد.</div><div class="bar"><button onclick="backupAll()">گرفتن کاپی</button><button class="g" onclick="$(\'#bf\').click()">برگرداندن کاپی</button></div></div>'}

/* ===== رندر ===== */
function render(){
  const k=keys();
  if(!k){
    $('#kbox').innerHTML='<b>قدم اول: ساختن کلید</b><div class="m">یک بار انجام می‌شود. کلید خصوصی فقط در همین مرورگر می‌ماند و جایی فرستاده نمی‌شود.</div><button onclick="gen()">ساختن کلید</button><button class="g" onclick="$(\'#kf\').click()">برگرداندن کلید از فایل</button>';
    $('#mainbox').style.display='none';return;
  }
  $('#kbox').innerHTML='<b>کلید آماده است</b><div class="m bad">⚠ همین حالا یک کپی از کلید خصوصی ذخیره کن و در چند جای امن نگه دار (فلش، ایمیل خودت). اگر گم شود، دیگر نمی‌توانی کد بسازی و باید همه مشتری‌ها را دوباره فعال کنی.</div><button onclick="saveKey()">ذخیره کپی کلید (فایل)</button><button class="g" onclick="$(\'#kf\').click()">برگرداندن کلید از فایل</button>'
   +'<label>کلید عمومی (این را برای من بفرست؛ خطری ندارد)<textarea readonly class="code" id="pk">'+esc(JSON.stringify(k.pub))+'</textarea></label><button class="g sm" onclick="cp(\'#pk\')">کپی کلید عمومی</button>';
  $('#mainbox').style.display='block';
  $('#tb-cust').className=TAB=='cust'?'on':'';$('#tb-not').className=TAB=='not'?'on':'';$('#tb-bk').className=TAB=='bk'?'on':'';
  renderBody();
}
function renderBody(){$('#body').innerHTML=TAB=='cust'?custBody():TAB=='not'?notBody():bkBody()}

migrateOld();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
